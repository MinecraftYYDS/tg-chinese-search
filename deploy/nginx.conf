# Replace domain/certificate paths when deploying to another hostname.
server {
    listen 80;
    listen [::]:80;
    server_name keaixm.awacat.cc;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tg-search-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name keaixm.awacat.cc;
    ssl_certificate /etc/letsencrypt/live/keaixm.awacat.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keaixm.awacat.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    add_header Strict-Transport-Security 'max-age=31536000' always;

    # Do not log query text or any potential credentials in URLs.
    access_log off;
    error_log /var/log/nginx/tg-search-error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }
}
